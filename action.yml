name: Tabwalk accessibility check
description: Crawl a site, check every page with axe-core and fail the job on accessibility problems
author: Artemy Andruschak

branding:
  icon: log-in
  color: blue

inputs:
  url:
    description: Site to check. Tabwalk starts here, reads the sitemap and follows links from page to page
    required: true
  max-pages:
    description: Maximum number of pages to check
    default: '50'
  # no args below: GitHub hands every input to the container as an INPUT_* variable
  include:
    description: 'Check only pages under these paths, one per line or comma-separated, like /blog/ or /docs/*'
    default: ''
  exclude:
    description: 'Skip pages under these paths, one per line or comma-separated, like /tag/ or *?page=*'
    default: ''
  ignore-rules:
    description: 'Leave out these rules, one per line or comma-separated, like color-contrast'
    default: ''
  ignore-selectors:
    description: 'Leave out problems inside elements that match these CSS selectors, one per line, like #chat-widget'
    default: ''
  # pass the four below from secrets: they go to the site only and never into the log
  http-username:
    description: 'HTTP Basic login, like the one most staging sites have'
    default: ''
  http-password:
    description: 'Password for http-username'
    default: ''
  headers:
    description: 'Headers sent to the site only, one "Name: value" per line, like "Authorization: Bearer …"'
    default: ''
  cookies:
    description: 'Cookies set before the first page opens, one name=value per line or a whole Cookie header'
    default: ''
  fail-on:
    description: Lowest impact that fails the job - critical, serious, moderate, minor or none
    default: critical
  baseline:
    description: 'A report from an earlier run, like a committed tabwalk-report.json. Only problems it does not have fail the job'
    default: ''
  comment:
    description: 'Comment on the pull request with the results, editing the same comment on every run. Needs "permissions: pull-requests: write"'
    default: 'false'
  github-token:
    description: Token to comment with
    default: ${{ github.token }}
  report:
    description: Where to write the JSON report, relative to the workspace
    default: tabwalk-report.json

runs:
  using: docker
  image: action/Dockerfile
  args:
    - ${{ inputs.url }}
    - --max-pages
    - ${{ inputs.max-pages }}
    - --fail-on
    - ${{ inputs.fail-on }}
    - --report
    - ${{ inputs.report }}
