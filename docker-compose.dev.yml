name: tabwalk

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Applies migrations, then exits. Everything else waits for it to succeed.
  migrate:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    command: ['node', 'dist/migrate.js']
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    command: ['node', 'dist/index.js', 'api']
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: ${PORT}
      PUBLIC_URL: ${PUBLIC_URL:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_LABEL: ${OIDC_LABEL:-}
      OIDC_ALLOWED_DOMAINS: ${OIDC_ALLOWED_DOMAINS:-}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    command: ['node', 'dist/index.js', 'worker']
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MAX_PAGES_PER_SCAN: ${MAX_PAGES_PER_SCAN}
      SCAN_CONCURRENCY: ${SCAN_CONCURRENCY}
      PAGE_TIMEOUT_MS: ${PAGE_TIMEOUT_MS}
      PUBLIC_URL: ${PUBLIC_URL:-}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_FROM: ${SMTP_FROM:-}
    # Chromium needs a bigger /dev/shm or it crashes on heavy pages
    shm_size: 1gb
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - '8080:80'
    depends_on:
      - api

volumes:
  db-data:
