# Keeps https from a TLS proxy in front of Tabwalk, so the API can mark its cookie Secure
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Single-page app: every path falls through to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /site.webmanifest {
    default_type application/manifest+json;
  }

  # The frontend calls /api; nginx proxies it to the api container
  location /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 120s;
  }
}
