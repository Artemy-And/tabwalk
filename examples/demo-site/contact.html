<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Contact — Acme Store</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <header>
    <a href="/"><img src="/img/logo.svg" width="120" height="40"></a>
    <nav>
      <a href="/">Home</a>
      <a href="/products/kettle.html">Kettles</a>
      <a href="/about.html">About</a>
      <a href="/contact.html">Contact</a>
    </nav>
  </header>
  <main id="content">
    <h1>Contact</h1>
    <form>
      <input type="text" placeholder="Your name">
      <input type="email" placeholder="Email">
      <select aria-label="Topic"><option>Order question</option><option>Returns</option></select>
      <textarea placeholder="Message"></textarea>
      <button><img src="/img/cart.svg"></button>
    </form>
    <section class="newsletter" id="newsletter">
      <h2>10% off your first order</h2>
      <form>
        <input type="email" placeholder="Email" aria-label="Email for the newsletter">
        <button type="submit">Sign up</button>
      </form>
    </section>
  </main>
  <footer>
    <p>Questions about an order? <a href="/contact.html">Click here</a>.</p>
    <p>© Acme Store</p>
  </footer>
  <script>
    const box = document.getElementById('newsletter');
    box.addEventListener('keydown', (event) => {
      if (event.key !== 'Tab') return;
      const fields = box.querySelectorAll('input, button');
      const first = fields[0];
      const last = fields[fields.length - 1];
      if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      } else if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      }
    });
  </script>
</body>
</html>
