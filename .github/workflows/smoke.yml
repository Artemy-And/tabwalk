name: Smoke test

on:
  release:
    types: [published]
  push:
    branches: [develop]
    paths: ['.github/workflows/smoke.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quick-start:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Start with the published images
        run: |
          cp .env.example .env
          start=$(date +%s)
          docker compose up -d
          until curl -sf http://localhost:8080/api/health > /dev/null; do
            sleep 2
            [ $(( $(date +%s) - start )) -gt 300 ] && { echo "API did not come up"; exit 1; }
          done
          echo "API up after $(( $(date +%s) - start ))s"

      - name: Add a site and scan it
        run: |
          site=$(curl -sf -X POST http://localhost:8080/api/sites \
            -H 'content-type: application/json' \
            -d '{"name":"Tabwalk","url":"https://tabwalk.dev"}' | jq -r .id)
          scan=$(curl -sf -X POST "http://localhost:8080/api/sites/$site/scans" | jq -r .id)
          start=$(date +%s)
          while :; do
            status=$(curl -sf "http://localhost:8080/api/scans/$scan" | jq -r .status)
            [ "$status" = done ] && break
            [ "$status" = failed ] && { curl -s "http://localhost:8080/api/scans/$scan" | jq; exit 1; }
            [ $(( $(date +%s) - start )) -gt 300 ] && { echo "Scan timed out ($status)"; exit 1; }
            sleep 3
          done
          curl -sf "http://localhost:8080/api/scans/$scan" | jq '{status, pages, summary}'
          pages=$(curl -sf "http://localhost:8080/api/scans/$scan" | jq .pages)
          [ "$pages" -ge 1 ] || { echo "No pages were checked"; exit 1; }
          curl -sf http://localhost:8080/ | grep -q '<title>' || { echo "Dashboard did not load"; exit 1; }

      - name: Logs
        if: failure()
        run: docker compose logs

  action:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check tabwalk.dev with the action
        uses: ./
        with:
          url: https://tabwalk.dev
          fail-on: minor

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tabwalk-report
          path: tabwalk-report.json
