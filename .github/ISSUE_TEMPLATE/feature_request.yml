name: Feature request
description: Propose a change that is already fairly clear
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Not sure yet? Start in [Ideas](https://github.com/Artemy-And/tabwalk/discussions/categories/ideas) instead.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds you use now
